name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check docs, formatting, code, unit tests, and terminal journeys
        run: make check
      - name: Check the Go agent acceptance cases
        run: make eval
      - name: Check for Go data races
        run: make test-race
      - name: Build all distribution archives and verify checksums
        if: runner.os == 'Linux'
        run: make dist
