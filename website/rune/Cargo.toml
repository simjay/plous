[package]
name = "plous-docs-rune"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "plous-docs-rune"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "5e6fe2d094bcd2ecf648f79e5a32a94cb8e3c960", default-features = false, features = ["svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "5e6fe2d094bcd2ecf648f79e5a32a94cb8e3c960", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
debug = 0
strip = "debuginfo"
